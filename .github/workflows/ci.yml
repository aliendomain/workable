name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./Workable.slnx --disable-parallel -p:RestoreBuildInParallel=false

      - name: Build
        run: dotnet build ./Workable.slnx --configuration Release --no-restore -maxcpucount:1 -p:UseSharedCompilation=false

      - name: Test
        run: dotnet test ./Workable.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type none

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./**/TestResults/**/*.trx
          if-no-files-found: ignore

  admin-ui:
    name: Admin UI validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/workable-admin-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/workable-admin-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check changed-code coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
