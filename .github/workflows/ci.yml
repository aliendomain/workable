name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./Workable.slnx --disable-parallel -p:RestoreBuildInParallel=false

      - name: Build
        run: dotnet build ./Workable.slnx --configuration Release --no-restore -maxcpucount:1 -p:UseSharedCompilation=false

      - name: Test
        run: dotnet test ./Workable.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --blame-hang --blame-hang-timeout 30s --blame-hang-dump-type none

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./**/TestResults/**/*.trx
          if-no-files-found: ignore
